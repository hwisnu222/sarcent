[package]
name = "sarcent"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
prost = "0.14.3"
sysinfo = "0.39.2"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"



[build-dependencies]
tonic-prost-build = "0.14.6"
