name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # Linux x86_64 (AMD/Intel)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: sarcent-x86_64

          # Linux ARM64 (aarch64)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: sarcent-aarch64

          # Android ARM64 (Android)
          - target: aarch64-linux-android
            runner: ubuntu-22.04
            artifact_name: sarcent-android-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk (Android Only)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk

      - name: Install build dependencies (Linux & Protobuf)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Build Release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            # target aarch64-linux-android
            cargo ndk -t arm64-v8a -p 29 build --release
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare Artifact
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/sarcent release/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/${{ matrix.artifact_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
